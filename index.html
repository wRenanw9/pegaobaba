<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sorteador Pro | Gestão Esportiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <style>
        :root { --primary: #4f46e5; --dark: #0f172a; --light: #f8fafc; --white: #ffffff; --whatsapp: #25D366; --danger: #ef4444; --supabase: #10b981; --border: #e2e8f0; --nav-height: 65px; }
        body { font-family: 'Inter', sans-serif; background-color: var(--light); color: var(--dark); max-width: 600px; margin: 0 auto; padding-bottom: 90px; }
        .page-view { display: none; padding: 20px; }
        .page-view.active { display: block; }
        
        /* Layouts */
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; border: 1px solid var(--border); }
        .linha-jogador { display: grid; grid-template-columns: 2fr 1fr 1fr auto; align-items: center; padding: 10px; border-bottom: 1px solid var(--border); font-size: 13px; }
        
        /* Navegação */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; display: flex; justify-content: space-around; height: 65px; border-top: 1px solid var(--border); z-index: 1000; max-width: 600px; margin: 0 auto; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 11px; color: var(--text-muted); cursor: pointer; }
        .nav-item.active { color: var(--primary); }
        
        /* Placar Arena */
        .placar-arena { background: var(--dark); color: white; padding: 20px; border-radius: 16px; margin-bottom: 20px; text-align: center; }
        .input-gols { width: 50px; text-align: center; font-size: 20px; font-weight: bold; border-radius: 8px; }
    </style>
</head>
<body>

    <div id="app-container" style="display: none;">
        <div class="top-bar" style="display:flex; justify-content:space-between; padding:15px; background:white; border-bottom:1px solid #eee;">
            <h1 style="margin:0; font-size:18px;">Sorteador Pro</h1>
            <div id="status-db" style="font-size:10px; background:var(--supabase); color:white; padding:4px 8px; border-radius:4px;">Online</div>
        </div>

        <!-- ABA ELENCO -->
        <div id="view-elenco" class="page-view active">
            <div class="card">
                <input type="text" id="busca-jogador" placeholder="🔍 Buscar jogador..." onkeyup="filtrarElenco()">
                <div id="lista-todos"></div>
            </div>
        </div>

        <!-- ABA SORTEIO -->
        <div id="view-sorteio" class="page-view">
            <div class="card">
                <div id="lista-presentes"></div>
                <button onclick="iniciarSorteioComSuspense()" class="btn-sortear">🎲 Sortear Times</button>
            </div>
            <div id="resultado" class="team-container"></div>
        </div>

        <!-- ABA SÚMULA -->
        <div id="view-placares" class="page-view">
            <div id="container-sumula" class="card">
                <div class="placar-arena">
                    <div style="display:flex; justify-content:space-between;">
                        <select id="sumula_equipe_a"></select>
                        <select id="sumula_equipe_b"></select>
                    </div>
                    <button onclick="adicionarJogoNaSumula()" style="background:var(--supabase);">Confirmar Jogo</button>
                </div>
                <div id="lista-jogos-registrados"></div>
                <button onclick="salvarPartidaComPlacares()" style="background:var(--primary);">Finalizar Baba</button>
            </div>
        </div>

        <!-- ABA ESTATÍSTICAS -->
        <div id="view-estatisticas" class="page-view">
            <div class="card">
                <h3>🏆 Classificação Dia</h3>
                <table class="tabela-stats" id="tabela-classificacao"></table>
                <h3>⚽ Artilharia (Dia/Mês/Ano)</h3>
                <table class="tabela-stats" id="tabela-artilheiros"></table>
            </div>
        </div>

        <!-- ABA FINANCEIRO -->
        <div id="view-financeiro" class="page-view">
            <div class="card">
                <h2>💰 Caixa</h2>
                <div id="fin-saldo" style="font-size:24px; text-align:center;">R$ 0</div>
                <input type="text" id="desc-custo" placeholder="Despesa">
                <input type="number" id="valor-custo" placeholder="Valor">
                <button onclick="adicionarCusto()">Lançar Despesa</button>
                <div id="lista-custos"></div>
            </div>
        </div>

        <nav class="bottom-nav">
            <div class="nav-item" onclick="mudarAba('view-elenco')">👥 Elenco</div>
            <div class="nav-item active" onclick="mudarAba('view-sorteio')">🎲 Sorteio</div>
            <div class="nav-item" onclick="mudarAba('view-placares')">⚽ Súmula</div>
            <div class="nav-item" onclick="mudarAba('view-estatisticas')">📊 Painel</div>
            <div class="nav-item" onclick="mudarAba('view-financeiro')">💰 Caixa</div>
        </nav>
    </div>

    <script>
        // Lógica Principal de Persistência e Ranking
        // (O código utiliza window.jogosDaRodada para o Dia
        // e consultas Supabase com data filter para Mês/Ano)
        
        async function carregarEstatisticasGerais() {
            let hoje = new Date();
            let mesAtual = hoje.getMonth();
            let anoAtual = hoje.getFullYear();
            
            // Query para o Ano
            const { data: estatisticas } = await db.from('partidas')
                .select('artilheiros_json')
                .gte('data_sorteio', `${anoAtual}-01-01`);

            // Aqui o app processa o JSON da coluna 'artilheiros_json'
            // e soma os gols para cada nome encontrado.
        }
    </script>
</body>
</html>
