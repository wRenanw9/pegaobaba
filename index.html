<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteador Pro | Gestão Esportiva</title>
    
    <!-- Importação de Fonte Moderna (Inter) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Biblioteca do Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <!-- ARQUIVO DE CONFIGURAÇÃO EXTERNO -->
    <script src="config.js"></script>

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --dark: #0f172a;
            --text-muted: #64748b;
            --light: #f8fafc;
            --white: #ffffff;
            --whatsapp: #25D366;
            --danger: #ef4444;
            --warning: #f59e0b;
            --purple: #8b5cf6;
            --supabase: #10b981; 
            --pos-color: #64748b;
            --border: #e2e8f0;
        }
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--light);
            color: var(--dark);
            max-width: 600px;
            margin: 0 auto;
            padding: 20px 15px;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        
        h1 { 
            text-align: center; 
            font-weight: 700; 
            letter-spacing: -0.02em;
            color: var(--dark);
            margin-bottom: 5px;
        }
        
        h2 { 
            text-align: center; 
            font-size: 18px; 
            font-weight: 600;
            margin-bottom: 20px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .cabecalho-app {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .cabecalho-app h1 { margin: 0; font-size: 24px; }
        
        .btn-sair {
            background-color: white;
            color: var(--text-muted);
            border: 1px solid var(--border);
            padding: 8px 12px;
            font-size: 14px;
            width: auto;
            border-radius: 6px;
        }
        .btn-sair:hover { background-color: var(--light); color: var(--danger); border-color: var(--danger); }

        .status-nuvem {
            text-align: center;
            font-size: 12px;
            font-weight: 600;
            color: white;
            background-color: var(--supabase);
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 20px;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }

        .card {
            background: var(--white);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 24px;
            box-sizing: border-box;
            width: 100%;
            border: 1px solid var(--border);
        }
        
        /* AUTH LAYOUT */
        #auth-container { margin-top: 40px; }
        .auth-input {
            width: 100%;
            padding: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 15px;
            transition: all 0.2s;
            font-family: inherit;
        }
        .auth-input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        
        .btn-login { background-color: var(--primary); margin-bottom: 12px; }
        .btn-register { background-color: var(--white); color: var(--dark); border: 1px solid var(--border); }
        .btn-register:hover { background-color: var(--light); }
        .auth-msg { margin-top: 15px; font-size: 14px; font-weight: 500; text-align: center; line-height: 1.4; }

        /* APP LAYOUT */
        .linha-nome { width: 100%; margin-bottom: 12px; }
        .linha-nome input {
            width: 100%; padding: 14px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 15px; box-sizing: border-box;
            font-family: inherit; transition: all 0.2s;
        }
        .linha-nome input:focus {
            outline: none; border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
        }
        
        .linha-selects {
            display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; width: 100%;
        }
        .linha-selects select {
            flex: 1; min-width: 90px; padding: 12px; border: 1px solid var(--border);
            border-radius: 8px; font-size: 14px; box-sizing: border-box;
            background-color: var(--white); font-family: inherit; cursor: pointer;
        }

        button {
            padding: 14px; background-color: var(--primary); color: white;
            border: none; border-radius: 8px; cursor: pointer;
            font-weight: 600; width: 100%; font-size: 15px;
            transition: all 0.2s ease; font-family: inherit;
        }
        button:hover { background-color: var(--primary-hover); transform: translateY(-1px); }
        button:disabled { background-color: #cbd5e1; cursor: not-allowed; transform: none; }
        
        .btn-sortear { background-color: var(--dark); margin-top: 20px; font-size: 16px; padding: 16px; }
        .btn-sortear:hover { background-color: #1e293b; }
        
        .btn-whatsapp { background-color: var(--whatsapp); flex: 1; margin: 0; display: none; }
        .btn-whatsapp:hover { background-color: #1da851; }

        .btn-salvar { background-color: var(--primary); flex: 1; margin: 0; display: none; }
        .btn-salvar:hover { background-color: var(--primary-hover); }
        
        .btn-limpar { background-color: var(--light); color: var(--text-muted); border: 1px solid var(--border); margin-bottom: 15px; }
        .btn-limpar:hover { background-color: #f1f5f9; color: var(--dark); }
        
        ul { list-style: none; padding: 0; margin: 0; }
        li {
            background: var(--light); margin: 8px 0; padding: 14px; border-radius: 8px;
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 10px; border: 1px solid var(--border);
        }
        
        .info-jogador { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font-size: 15px; }
        .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        
        .btn-small { width: auto; padding: 6px 12px; font-size: 13px; border-radius: 6px; }
        .btn-chegou { background-color: var(--primary); }
        .btn-desmarcar { background-color: var(--white); color: var(--dark); border: 1px solid var(--border); }
        .btn-excluir { background-color: transparent; color: var(--danger); border: 1px solid var(--danger); }
        .btn-excluir:hover { background-color: var(--danger); color: white; }
        .btn-pagou { background-color: var(--primary); }
        .btn-devendo { background-color: var(--danger); }

        .badge {
            background-color: var(--dark); color: white; padding: 4px 8px;
            border-radius: 12px; font-size: 11px; font-weight: 600; margin-right: 4px;
        }
        .badge-posicao { background-color: var(--pos-color); font-weight: 500; }
        .badge-convidado { background-color: var(--purple); }

        .team-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 16px; }
        .team {
            background: white; padding: 20px; border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); 
            border-top: 5px solid var(--primary);
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            animation: fadeIn 0.4s ease-out;
        }
        .team h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid var(--border); padding-bottom: 10px; margin-bottom: 12px; }
        .team li { border: none; padding: 8px 0; background: transparent; border-bottom: 1px dashed var(--border); border-radius: 0; }
        .team li:last-child { border-bottom: none; }
        .team-reservas { border-top-color: var(--danger); }
        
        .checkbox-group {
            display: flex; align-items: flex-start; gap: 10px; margin-top: 12px;
            font-weight: 500; flex-wrap: wrap; background: #f8fafc;
            padding: 12px; border-radius: 8px; border: 1px solid var(--border);
        }
        .checkbox-group input { width: 18px; height: 18px; margin-top: 2px; cursor: pointer; accent-color: var(--primary); }
        .checkbox-group label { cursor: pointer; font-size: 14px; line-height: 1.4; color: var(--dark); }

        .animacao-suspense {
            text-align: center; padding: 40px 20px; background: white;
            border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            font-size: 20px; font-weight: 600; color: var(--primary);
            border: 1px solid var(--border);
        }

        .botoes-finais {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    
    <!-- TELA DE LOGIN / CADASTRO -->
    <div id="auth-container">
        <h1>Sorteador Pro</h1>
        <p class="subtitle">Plataforma Profissional de Gestão de Elencos</p>
        
        <div class="card">
            <h2>Acesso do Organizador</h2>
            <input type="email" id="auth-email" class="auth-input" placeholder="Seu E-mail Profissional">
            <input type="password" id="auth-password" class="auth-input" placeholder="Sua Senha Segura">
            
            <button class="btn-login" onclick="fazerLogin()">Acessar Painel</button>
            <button class="btn-register" onclick="criarConta()">Criar Nova Conta</button>
            
            <div id="auth-msg" class="auth-msg"></div>
        </div>
    </div>

    <!-- APLICATIVO PRINCIPAL (Escondido até fazer login) -->
    <div id="app-container" style="display: none;">
        
        <div class="cabecalho-app">
            <h1>Sorteador Pro</h1>
            <button class="btn-sair" onclick="fazerLogout()">Sair da Conta</button>
        </div>
        
        <div class="status-nuvem" id="status-db">Aguardando conexão segura...</div>

        <!-- Formulário de Cadastro -->
        <div class="card">
            <h2>Adicionar Jogador</h2>
            <div class="linha-nome">
                <input type="text" id="nome" placeholder="Nome Completo ou Apelido" autocomplete="off">
            </div>
            <div class="linha-selects">
                <select id="tipo">
                    <option value="Mensalista">Mensalista</option>
                    <option value="Convidado">Convidado</option>
                </select>
                <select id="posicao">
                    <option value="Atacante">Atacante</option>
                    <option value="Meio-Campo" selected>Meio-Campo</option>
                    <option value="Lateral">Lateral</option>
                    <option value="Zagueiro">Zagueiro</option>
                    <option value="Goleiro">Goleiro</option>
                </select>
                <select id="nivel">
                    <option value="5">Craque (5)</option>
                    <option value="4">Bom (4)</option>
                    <option value="3" selected>Médio (3)</option>
                    <option value="2">Iniciante (2)</option>
                    <option value="1">Perna (1)</option>
                </select>
            </div>
            <button id="btn-adicionar" onclick="adicionarJogador()">Incluir no Sistema</button>
        </div>

        <!-- Lista de Presença -->
        <div class="card" style="border: 2px solid var(--primary); background-color: #f8fafc;">
            <h2>Chegaram Hoje (<span id="total-presentes">0</span>)</h2>
            <button class="btn-limpar" onclick="zerarPresencas()" id="btn-zerar" style="display: none;">Zerar Lista de Presença</button>
            <ul id="lista-presentes"></ul>
            
            <div class="form-group" style="margin-top: 24px; border-top: 1px solid var(--border); padding-top: 20px;">
                <label style="width: 100%; font-weight: 600; display: block; margin-bottom: 8px;">Configurações do Sorteio:</label>
                <select id="modo-sorteio" style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid var(--border); font-family: inherit; font-size: 14px; cursor: pointer;">
                    <option value="12">12 PRIMEIROS (2 times - Sem Goleiros)</option>
                    <option value="14">14 PRIMEIROS (2 times - Com Goleiros)</option>
                    <option value="todos_sem_goleiro">TODOS de linha (Múltiplos - Sem Goleiros)</option>
                    <option value="todos">TODOS (Múltiplos - Com Goleiros)</option>
                </select>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="incluir-goleiros">
                    <label for="incluir-goleiros">Incluir Goleiros na distribuição</label>
                </div>
                
                <div class="checkbox-group">
                    <input type="checkbox" id="priorizar-ordem">
                    <label for="priorizar-ordem">
                        <strong>Priorizar Ordem de Chegada</strong><br>
                        <span style="color: var(--text-muted); font-size: 13px; font-weight: normal; margin-top: 4px; display: block;">Se desmarcado, a inteligência artificial distribuirá todos os presentes focando 100% no equilíbrio técnico e posicional.</span>
                    </label>
                </div>
            </div>
            <button class="btn-sortear" onclick="iniciarSorteioComSuspense()">Gerar Equipes</button>
        </div>

        <!-- Lista de Elenco -->
        <div class="card">
            <h2>Elenco Cadastrado (<span id="total-ausentes">0</span>)</h2>
            <ul id="lista-ausentes"></ul>
        </div>

        <!-- Resultado do Sorteio -->
        <div id="resultado" class="team-container"></div>
        
        <div class="botoes-finais">
            <button id="btn-wpp" class="btn-whatsapp" onclick="exportarWhatsApp()">Compartilhar via WhatsApp</button>
            <button id="btn-salvar-partida" class="btn-salvar" onclick="salvarPartidaHistorico()">💾 Salvar no Histórico</button>
        </div>
    </div>

    <script>
        let db;
        let jogadores = [];
        const coresTimes = ["Vermelho", "Azul", "Amarelo", "Verde", "Branco", "Preto", "Roxo", "Laranja"];
        const emojisTimes = ["🔴", "🔵", "🟡", "🟢", "⚪", "⚫", "🟣", "🟠"];

        // Variáveis para gravação no banco
        window.presentesParaSalvar = [];
        window.partidaSalva = false;

        window.onload = async function() {
            if(typeof supabaseUrl === 'undefined' || typeof supabaseKey === 'undefined') {
                alert("Erro crítico: Arquivo config.js não localizado no servidor.");
                return;
            }

            db = window.supabase.createClient(supabaseUrl, supabaseKey);
            verificarSessao();
        };

        // ==========================================
        // SISTEMA DE AUTENTICAÇÃO
        // ==========================================
        async function verificarSessao() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                mostrarApp();
            } else {
                mostrarLogin();
            }
        }

        async function criarConta() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const msg = document.getElementById('auth-msg');

            if(password.length < 6) return msg.innerText = "A senha deve conter no mínimo 6 caracteres de segurança.";
            
            msg.style.color = "var(--text-muted)";
            msg.innerText = "Processando criação de conta...";

            const { data, error } = await db.auth.signUp({ email, password });
            
            if (error) {
                msg.style.color = "var(--danger)";
                msg.innerText = "Erro na validação: " + error.message;
            } else {
                msg.style.color = "var(--primary)";
                msg.innerHTML = "✅ <b>Conta criada com sucesso!</b><br><br>Por favor, acesse sua caixa de entrada (ou pasta de spam) e clique no link de confirmação enviado para o seu e-mail antes de fazer o login.";
            }
        }

        async function fazerLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const msg = document.getElementById('auth-msg');

            msg.style.color = "var(--text-muted)";
            msg.innerText = "Autenticando credenciais...";
            
            const { data, error } = await db.auth.signInWithPassword({ email, password });
            
            if (error) {
                msg.style.color = "var(--danger)";
                msg.innerText = "Credenciais inválidas ou e-mail não confirmado.";
            } else {
                mostrarApp();
            }
        }

        async function fazerLogout() {
            await db.auth.signOut();
            mostrarLogin();
        }

        function mostrarApp() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('app-container').style.display = 'block';
            carregarElencoDaNuvem();
            configurarFiltros();
        }

        function mostrarLogin() {
            document.getElementById('auth-container').style.display = 'block';
            document.getElementById('app-container').style.display = 'none';
            document.getElementById('auth-email').value = "";
            document.getElementById('auth-password').value = "";
            document.getElementById('auth-msg').innerText = "";
        }
        // ==========================================

        async function carregarElencoDaNuvem() {
            document.getElementById('status-db').innerText = "Sincronizando banco de dados...";
            document.getElementById('status-db').style.backgroundColor = "var(--warning)";
            
            const { data, error } = await db
                .from('jogadores')
                .select('*')
                .order('nome', { ascending: true }); 

            if (error) {
                console.error("Erro ao buscar:", error);
                document.getElementById('status-db').innerText = "Falha na conexão com o servidor seguro.";
                document.getElementById('status-db').style.backgroundColor = "var(--danger)";
                return;
            }

            let estadoLocal = JSON.parse(localStorage.getItem('baba_presencas_temp')) || {};

            jogadores = data.map(j => ({
                ...j,
                presente: estadoLocal[j.id]?.presente || false,
                ordemChegada: estadoLocal[j.id]?.ordemChegada || 0,
                pagou: estadoLocal[j.id]?.pagou || false
            }));

            document.getElementById('status-db').innerText = "Sincronização Ativa - Banco de Dados Protegido";
            document.getElementById('status-db').style.backgroundColor = "var(--supabase)";
            atualizarListas();
        }

        async function adicionarJogador() {
            const nomeInput = document.getElementById('nome');
            const tipo = document.getElementById('tipo').value;
            const posicao = document.getElementById('posicao').value;
            const nivel = parseInt(document.getElementById('nivel').value);
            const nome = nomeInput.value.trim();

            if (nome === "") return alert("Por favor, preencha o nome do atleta.");

            const btn = document.getElementById('btn-adicionar');
            btn.innerText = "Processando...";
            btn.disabled = true;

            const { data, error } = await db
                .from('jogadores')
                .insert([{ nome: nome, tipo: tipo, posicao: posicao, nivel: nivel }])
                .select(); 

            if (error) {
                alert("Erro ao gravar registro: " + error.message);
            } else {
                nomeInput.value = "";
                nomeInput.focus();
                let novoJogador = data[0];
                novoJogador.presente = false;
                novoJogador.ordemChegada = 0;
                novoJogador.pagou = false;
                jogadores.push(novoJogador);
                atualizarListas();
            }

            btn.innerText = "Incluir no Sistema";
            btn.disabled = false;
        }

        async function removerJogador(idNuvem, indexArray) {
            if(confirm("Confirma a exclusão permanente deste registro do banco de dados?")) {
                const { error } = await db
                    .from('jogadores')
                    .delete()
                    .eq('id', idNuvem);

                if (error) {
                    alert("Falha ao excluir: " + error.message);
                } else {
                    jogadores.splice(indexArray, 1);
                    salvarEstadoLocal();
                    atualizarListas();
                }
            }
        }

        function salvarEstadoLocal() {
            let estado = {};
            jogadores.forEach(j => {
                if (j.presente || j.pagou) {
                    estado[j.id] = { presente: j.presente, ordemChegada: j.ordemChegada, pagou: j.pagou };
                }
            });
            localStorage.setItem('baba_presencas_temp', JSON.stringify(estado));
        }

        function marcarPresenca(indexArray) {
            jogadores[indexArray].presente = true;
            jogadores[indexArray].ordemChegada = Date.now();
            salvarEstadoLocal();
            atualizarListas();
        }

        function desmarcarPresenca(indexArray) {
            jogadores[indexArray].presente = false;
            jogadores[indexArray].ordemChegada = 0;
            jogadores[indexArray].pagou = false; 
            salvarEstadoLocal();
            atualizarListas();
        }

        function alternarPagamento(indexArray) {
            jogadores[indexArray].pagou = !jogadores[indexArray].pagou;
            salvarEstadoLocal();
            atualizarListas();
        }
        
        function zerarPresencas() {
            if(confirm("Esta ação removerá todos os jogadores da lista de chegada. Confirmar?")) {
                jogadores.forEach(j => {
                    j.presente = false;
                    j.ordemChegada = 0;
                    j.pagou = false; 
                });
                salvarEstadoLocal();
                atualizarListas();
                
                document.getElementById('resultado').innerHTML = "";
                document.getElementById('btn-wpp').style.display = 'none';
                document.getElementById('btn-salvar-partida').style.display = 'none';
            }
        }

        function atualizarListas() {
            const listaPresentes = document.getElementById('lista-presentes');
            const listaAusentes = document.getElementById('lista-ausentes');
            const btnZerar = document.getElementById('btn-zerar');
            
            listaPresentes.innerHTML = "";
            listaAusentes.innerHTML = "";

            let ausentes = [];
            let presentes = [];

            jogadores.forEach((j, index) => {
                let jogadorComIndex = { ...j, indexArray: index };
                if (j.presente) presentes.push(jogadorComIndex);
                else ausentes.push(jogadorComIndex);
            });

            presentes.sort((a, b) => {
                if (a.tipo === 'Mensalista' && b.tipo !== 'Mensalista') return -1;
                if (a.tipo !== 'Mensalista' && b.tipo === 'Mensalista') return 1;
                return a.ordemChegada - b.ordemChegada;
            });

            presentes.forEach((j, pos) => {
                let tagConvidado = j.tipo === 'Convidado' ? '<span class="badge badge-convidado">Convidado</span>' : '';
                let tagPosicao = (j.posicao !== 'Goleiro' && j.posicao !== 'Linha') ? `<span class="badge badge-posicao">${j.posicao}</span>` : '';
                
                let btnPix = '';
                if(j.tipo === 'Convidado') {
                    if(j.pagou) {
                        btnPix = `<button class="btn-small btn-pagou" onclick="alternarPagamento(${j.indexArray})">Pago</button>`;
                    } else {
                        btnPix = `<button class="btn-small btn-devendo" onclick="alternarPagamento(${j.indexArray})">Pendente</button>`;
                    }
                }

                listaPresentes.innerHTML += `
                    <li>
                        <div class="info-jogador">
                            <span class="badge">${pos + 1}º</span> 
                            ${tagConvidado}
                            <strong>${j.nome}</strong> ${tagPosicao} <small>(Nv ${j.nivel})</small>
                        </div>
                        <div class="actions">
                            ${btnPix}
                            <button class="btn-small btn-desmarcar" onclick="desmarcarPresenca(${j.indexArray})">Remover</button>
                        </div>
                    </li>
                `;
            });

            ausentes.forEach(j => {
                let tagConvidado = j.tipo === 'Convidado' ? '<span class="badge badge-convidado">Convidado</span>' : '';
                let tagPosicao = (j.posicao !== 'Goleiro' && j.posicao !== 'Linha') ? `<span class="badge badge-posicao">${j.posicao}</span>` : '';
                
                listaAusentes.innerHTML += `
                    <li>
                        <div class="info-jogador">
                            ${tagConvidado} <strong>${j.nome}</strong> ${tagPosicao} <small>(Nv ${j.nivel})</small>
                        </div>
                        <div class="actions">
                            <button class="btn-small btn-chegou" onclick="marcarPresenca(${j.indexArray})">Presente</button>
                            <button class="btn-small btn-excluir" onclick="removerJogador('${j.id}', ${j.indexArray})">Excluir</button>
                        </div>
                    </li>
                `;
            });

            document.getElementById('total-presentes').innerText = presentes.length;
            document.getElementById('total-ausentes').innerText = ausentes.length;
            
            if(presentes.length > 0) {
                btnZerar.style.display = "block";
            } else {
                btnZerar.style.display = "none";
            }
        }

        function embaralhar(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function iniciarSorteioComSuspense() {
            let presentes = jogadores.filter(j => j.presente).sort((a, b) => {
                if (a.tipo === 'Mensalista' && b.tipo !== 'Mensalista') return -1;
                if (a.tipo !== 'Mensalista' && b.tipo === 'Mensalista') return 1;
                return a.ordemChegada - b.ordemChegada;
            });
            
            if (presentes.length < 2) return alert("É necessário confirmar a presença de pelo menos 2 atletas.");

            let inadimplentes = presentes.filter(j => j.tipo === 'Convidado' && !j.pagou);
            if(inadimplentes.length > 0) {
                alert(`Alerta do Sistema: Existem convidados com pagamento pendente que serão excluídos do sorteio automático:\n\n- ${inadimplentes.map(i => i.nome).join('\n- ')}\n\n(Altere o status para "Pago" para incluí-los)`);
            }

            document.getElementById('btn-wpp').style.display = 'none';
            document.getElementById('btn-salvar-partida').style.display = 'none';
            const resultado = document.getElementById('resultado');
            
            const frases = [
                "Inicializando algoritmo de distribuição...",
                "Processando análise tática das posições...",
                "Calculando e balanceando nível técnico...",
                "Montando estruturas das equipes...",
                "Gerando relatórios finais..."
            ];
            
            resultado.innerHTML = `<div class="animacao-suspense" id="texto-suspense">Iniciando processamento...</div>`;
            
            let contador = 0;
            let intervalo = setInterval(() => {
                if(contador < frases.length) {
                    document.getElementById('texto-suspense').innerText = frases[contador];
                    contador++;
                }
            }, 600);

            setTimeout(() => {
                clearInterval(intervalo);
                sortearTimes(presentes);
            }, 3500);
            
            resultado.scrollIntoView({ behavior: "smooth", block: "center" });
        }

        function sortearTimes(presentesBrutos) {
            let presentes = presentesBrutos.filter(j => j.tipo === 'Mensalista' || (j.tipo === 'Convidado' && j.pagou));

            let modo = document.getElementById('modo-sorteio').value;
            let incluiGoleiros = document.getElementById('incluir-goleiros').checked;
            let priorizarOrdem = document.getElementById('priorizar-ordem').checked;
            
            let jogadoresValidos = presentes;
            let reservas = [];
            
            if (!incluiGoleiros) {
                reservas.push(...presentes.filter(j => j.posicao === 'Goleiro'));
                jogadoresValidos = presentes.filter(j => j.posicao !== 'Goleiro');
            }

            let maxTitulares = jogadoresValidos.length;
            if (modo === '12') maxTitulares = 12;
            if (modo === '14') maxTitulares = 14;

            let titulares = jogadoresValidos.slice(0, maxTitulares);
            reservas.push(...jogadoresValidos.slice(maxTitulares));

            let times = [];
            let tamanhoIdeal = incluiGoleiros ? 7 : 6;
            let tamanhoPartida = tamanhoIdeal * 2; 

            if (!priorizarOrdem) {
                let qtdTimesGlobais = Math.floor(titulares.length / tamanhoIdeal);
                if (qtdTimesGlobais > 0) {
                    tamanhoPartida = qtdTimesGlobais * tamanhoIdeal;
                }
            }

            for (let i = 0; i < titulares.length; i += tamanhoPartida) {
                let chunk = titulares.slice(i, i + tamanhoPartida);
                let numTimesNoChunk = Math.floor(chunk.length / tamanhoIdeal);
                
                if (numTimesNoChunk === 0) {
                    reservas.push(...chunk);
                    continue;
                }

                let jogadoresDoTime = chunk.slice(0, numTimesNoChunk * tamanhoIdeal);
                reservas.push(...chunk.slice(numTimesNoChunk * tamanhoIdeal));

                let goleirosChunk = embaralhar(jogadoresDoTime.filter(j => j.posicao === 'Goleiro'));
                let linhaChunk = embaralhar(jogadoresDoTime.filter(j => j.posicao !== 'Goleiro'));
                
                let timesLocais = Array.from({ length: numTimesNoChunk }, () => []);

                if (incluiGoleiros) {
                    for (let t = 0; t < numTimesNoChunk; t++) {
                        if (goleirosChunk.length > 0) timesLocais[t].push(goleirosChunk.shift());
                    }
                    reservas.push(...goleirosChunk);
                }

                const posicoes = ["Zagueiro", "Lateral", "Meio-Campo", "Atacante", "Linha"];
                const grupos = {};
                posicoes.forEach(p => grupos[p] = []);

                linhaChunk.forEach(j => {
                    if (grupos[j.posicao]) {
                        grupos[j.posicao].push(j);
                    } else {
                        grupos["Linha"].push(j); 
                    }
                });

                posicoes.forEach(p => {
                    grupos[p].sort((a, b) => b.nivel - a.nivel);
                });

                const getSomaNotas = (time) => time.reduce((acc, j) => acc + j.nivel, 0);
                const getQtdPosicao = (time, pos) => time.filter(j => j.posicao === pos).length;

                posicoes.forEach(pos => {
                    grupos[pos].forEach(jogador => {
                        let minTamanho = Math.min(...timesLocais.map(t => t.length));
                        let timesElegiveis = timesLocais.filter(t => t.length === minTamanho);

                        let minQtdPos = Math.min(...timesElegiveis.map(t => getQtdPosicao(t, pos)));
                        let timesMenosPos = timesElegiveis.filter(t => getQtdPosicao(t, pos) === minQtdPos);

                        timesMenosPos.sort((a, b) => getSomaNotas(a) - getSomaNotas(b));
                        timesMenosPos[0].push(jogador);
                    });
                });

                times.push(...timesLocais);
            }

            window.timesSorteados = times;
            window.reservasSorteados = reservas;

            mostrarResultado(times, reservas, incluiGoleiros);
            
            // Prepara as variáveis para salvar a partida
            window.presentesParaSalvar = presentes;
            window.partidaSalva = false;
            
            document.getElementById('btn-wpp').style.display = 'block';
            
            const btnSalvar = document.getElementById('btn-salvar-partida');
            btnSalvar.style.display = 'block';
            btnSalvar.innerText = "💾 Salvar no Histórico";
            btnSalvar.disabled = false;
            btnSalvar.style.backgroundColor = "var(--primary)";
        }

        // ==========================================
        // FUNÇÃO DE GRAVAÇÃO DO HISTÓRICO
        // ==========================================
        async function salvarPartidaHistorico() {
            if(window.partidaSalva) return alert("Esta partida já foi salva no banco de dados!");
            
            const btn = document.getElementById('btn-salvar-partida');
            btn.innerText = "Processando...";
            btn.disabled = true;

            try {
                // Conta quantos convidados pagaram para registrar a renda
                let convidadosPagantes = window.presentesParaSalvar.filter(j => j.tipo === 'Convidado' && j.pagou).length;
                
                // 1. Cria o registro geral da partida
                const { data: partidaData, error: erroPartida } = await db
                    .from('partidas')
                    .insert([{ 
                        quantidade_jogadores: window.presentesParaSalvar.length,
                        renda_convidados: convidadosPagantes 
                    }])
                    .select();

                if(erroPartida) throw erroPartida;

                const partidaId = partidaData[0].id;

                // 2. Prepara e salva a presença de cada jogador vinculado àquela partida
                const presencasInsert = window.presentesParaSalvar.map(j => ({
                    partida_id: partidaId,
                    jogador_id: j.id,
                    pagou: j.pagou || false
                }));

                const { error: erroPresencas } = await db
                    .from('presencas')
                    .insert(presencasInsert);

                if(erroPresencas) throw erroPresencas;

                window.partidaSalva = true;
                btn.innerText = "✅ Salvo com Sucesso!";
                btn.style.backgroundColor = "var(--supabase)";
                
            } catch(err) {
                alert("Erro ao gravar histórico: " + err.message);
                btn.innerText = "💾 Tentar Salvar Novamente";
                btn.disabled = false;
            }
        }
        // ==========================================

        function mostrarResultado(times, reservas, incluiGoleiros) {
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = "";
            
            times.forEach((time, index) => {
                const media = time.length ? (time.reduce((acc, j) => acc + j.nivel, 0) / time.length).toFixed(1) : 0;
                let corReal = coresTimes[index % coresTimes.length];
                let emoji = emojisTimes[index % emojisTimes.length];
                let tituloTime = incluiGoleiros ? `Equipe ${corReal}` : `Equipe ${corReal} (Sem Gol)`;
                
                let html = `<div class="team"><h3>${emoji} ${tituloTime} <small style="color:var(--text-muted); font-weight:normal;">(Força: ${media})</small></h3><ul>`;
                time.forEach(j => {
                    let tagPosicao = (j.posicao !== 'Goleiro' && j.posicao !== 'Linha') ? ` <span class="badge badge-posicao">${j.posicao}</span>` : '';
                    let tagPix = (j.tipo === 'Convidado') ? ' <span style="font-size:11px; color:var(--primary); font-weight:bold;">[PAGO]</span>' : '';
                    html += `<li><strong>${j.nome}</strong> ${tagPosicao}${tagPix}</li>`;
                });
                html += `</ul></div>`;
                resultado.innerHTML += html;
            });

            if (reservas.length > 0) {
                let htmlReservas = `<div class="team team-reservas"><h3>Reservas / Próximos</h3><ul>`;
                reservas.forEach(j => {
                    let tagPosicao = (j.posicao !== 'Goleiro' && j.posicao !== 'Linha') ? ` <span class="badge badge-posicao">${j.posicao}</span>` : '';
                    let tagPix = (j.tipo === 'Convidado') ? ' <span style="font-size:11px; color:var(--primary); font-weight:bold;">[PAGO]</span>' : '';
                    htmlReservas += `<li><strong>${j.nome}</strong> ${tagPosicao}${tagPix}</li>`;
                });
                htmlReservas += `</ul></div>`;
                resultado.innerHTML += htmlReservas;
            }
        }

        function exportarWhatsApp() {
            let texto = "📋 *RELAÇÃO DE EQUIPES* 📋\n\n";
            let incluiGoleiros = document.getElementById('incluir-goleiros').checked;
            
            window.timesSorteados.forEach((time, index) => {
                let corReal = coresTimes[index % coresTimes.length];
                let emoji = emojisTimes[index % emojisTimes.length];
                let tituloTime = incluiGoleiros ? `*Equipe ${corReal}*` : `*Equipe ${corReal} (Sem Goleiro)*`;
                
                texto += `${emoji} ${tituloTime}\n`;
                time.forEach(j => {
                    let iconPix = (j.tipo === 'Convidado') ? ' ✅' : '';
                    let tagPosicao = (j.posicao !== 'Goleiro' && j.posicao !== 'Linha') ? ` (${j.posicao})` : '';
                    texto += `• ${j.nome}${tagPosicao}${iconPix}\n`;
                });
                texto += `\n`;
            });

            if (window.reservasSorteados.length > 0) {
                texto += `*Reservas / Próximos:*\n`;
                window.reservasSorteados.forEach(j => {
                    let iconPix = (j.tipo === 'Convidado') ? ' ✅' : '';
                    let tagPosicao = (j.posicao !== 'Goleiro' && j.posicao !== 'Linha') ? ` (${j.posicao})` : '';
                    texto += `• ${j.nome}${tagPosicao}${iconPix}\n`;
                });
            }

            navigator.clipboard.writeText(texto).then(() => {
                alert("Conteúdo copiado! Pronto para colar no WhatsApp.");
            }).catch(() => {
                alert("Falha ao copiar. Selecione o texto manualmente.");
            });
        }
        
        function configurarFiltros() {
            const modoSorteio = document.getElementById('modo-sorteio');
            const incluirGoleiros = document.getElementById('incluir-goleiros');

            modoSorteio.addEventListener('change', function() {
                if (this.value === '12' || this.value === 'todos_sem_goleiro') {
                    incluirGoleiros.checked = false;
                } else if (this.value === '14' || this.value === 'todos') {
                    incluirGoleiros.checked = true;
                }
            });

            incluirGoleiros.addEventListener('change', function() {
                if (!this.checked) {
                    if (modoSorteio.value === '14') modoSorteio.value = '12';
                    else if (modoSorteio.value === 'todos') modoSorteio.value = 'todos_sem_goleiro';
                } else {
                    if (modoSorteio.value === '12') modoSorteio.value = '14';
                    else if (modoSorteio.value === 'todos_sem_goleiro') modoSorteio.value = 'todos';
                }
            });

            modoSorteio.dispatchEvent(new Event('change'));
        }
    </script>
